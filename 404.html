<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina niet gevonden | Muurslot</title>
<meta name="robots" content="noindex">
<style>
  :root{--paper:#f8f7f4;--ink:#1c1917;--zinc:#6b6560;--line:#e2ddd6;--oranje:#E8623A}
  *{box-sizing:border-box}
  html{background:var(--paper)}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    background:var(--paper);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.6}
  main{max-width:34rem}
  .merk{font-weight:700;font-size:19px;letter-spacing:-0.01em;margin:0 0 28px}
  .merk i{font-style:normal;color:var(--oranje)}
  h1{font-size:clamp(30px,7vw,44px);line-height:1.08;letter-spacing:-0.02em;margin:0 0 14px;text-wrap:balance}
  p{margin:0 0 14px;color:var(--zinc)}
  a.knop{display:inline-block;margin:8px 0 18px;padding:14px 26px;border-radius:5px;
    background:var(--oranje);color:#fff;font-weight:700;text-decoration:none}
  a.knop:hover{background:#c94e28}
  a{color:var(--oranje)}
</style>
</head>
<body>
<main>
  <p class="merk">Muurslot<i>.</i>com</p>
  <h1>Deze pagina bestaat niet.</h1>
  <p>Het adres klopt niet meer, of er is een typfout gemaakt. Op de startpagina vind je alles over het muuranker en kun je bestellen.</p>
  <a class="knop" href="/">Naar de startpagina</a>
  <p>Kom je er niet uit? Bel <a href="tel:+31629471533">06 29 47 15 33</a>.</p>
</main>
</body>
</html>
