[functions]
  directory = "netlify/functions"

# Foto's en filmpjes: een bezoeker die terugkomt hoeft ze niet opnieuw te laden.
# De tijden zijn kort gehouden omdat dezelfde bestandsnaam soms een nieuw filmpje krijgt.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/film/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Lettertypen veranderen nooit onder dezelfde naam (bij een nieuwe versie komt er een nieuwe naam).
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# De talen hebben elk een eigen pagina 'niet gevonden'.
[[redirects]]
  from = "/en/*"
  to = "/en/404.html"
  status = 404

[[redirects]]
  from = "/de/*"
  to = "/de/404.html"
  status = 404

[[redirects]]
  from = "/es/*"
  to = "/es/404.html"
  status = 404

[[redirects]]
  from = "/zh/*"
  to = "/zh/404.html"
  status = 404

# De map talen bevat het bouwscript en de woordenlijsten; die horen niet online te staan.
[[redirects]]
  from = "/talen/*"
  to = "/404.html"
  status = 404
  force = true
