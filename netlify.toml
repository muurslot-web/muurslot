[functions]
  directory = "netlify/functions"

# Foto's en filmpjes: een bezoeker die terugkomt hoeft ze niet opnieuw te laden.
# De tijden zijn kort gehouden omdat dezelfde bestandsnaam soms een nieuw filmpje krijgt.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/film/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
